name: Deploy Documentation and Library to GitHub Pages

on:
  push:
    branches:
      - release  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install core dependencies
        run: |
          cd core
          npm install

      - name: Generate JSDoc documentation
        run: |
          cd core
          npm run docs

      - name: Build library
        run: |
          cd library
          node build-library.js

      - name: Create deployment structure
        run: |
          mkdir -p deploy
          cp -r docs/. deploy/
          cp -r library/. deploy/library/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
